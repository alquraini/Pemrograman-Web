<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Akademik</title>

<!-- Bootstrap 5.3.3 via CDN, dengan atribut integrity -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous">

<link rel="stylesheet" href="04-tugas-style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header Navigasi -->

<header class="site-header">
  <div class="site-header__brand">Portal Akademik</div>

  <button class="site-header__toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Buka menu navigasi">
    &#9776;
  </button>

  <nav class="site-header__nav" id="site-nav">
    <a href="#" class="site-header__link site-header__link--active">Beranda</a>
    <a href="#" class="site-header__link">KHS</a>
    <a href="#" class="site-header__link">KRS</a>
    <a href="#" class="site-header__link">Keluar</a>
  </nav>
</header>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous">
</script>

<script>
  document.querySelector(".site-header__toggle").addEventListener("click", function () {
    var nav = document.getElementById("site-nav");
    var expanded = this.getAttribute("aria-expanded") === "true";
    this.setAttribute("aria-expanded", String(!expanded));
    nav.classList.toggle("site-header__nav--open");
  });
</script>

</body>
</html>
